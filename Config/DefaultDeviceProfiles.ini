; Grafik-Basis fuer iPhones. Feintuning nach Messung auf dem Geraet (siehe Docs/README.md, Abschnitt Leistung).
; r.MobileContentScaleFactor: 0 = native Aufloesung, 2.0 = doppelte Punkt-Aufloesung (guter Startwert), 3.0 = native bei 3x-Displays
[IOS DeviceProfile]
+CVars=r.MobileContentScaleFactor=2.0
+CVars=r.Mobile.TonemapSubpass=1
+CVars=r.ViewDistanceScale=1.0
+CVars=foliage.DensityScale=0
+CVars=r.DetailMode=1
+CVars=r.MaterialQualityLevel=1
+CVars=t.MaxFPS=60
